name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          # The Hugo module's go.sum lives in docs/, not the repo root where
          # setup-go's cache looks by default ("Dependencies file is not found").
          cache-dependency-path: docs/go.sum

      # Pinned to what the local build uses (docs/docker-compose.yml's
      # hugomods/hugo:exts image: Hugo 0.154.5 + Dart Sass) -- "latest" broke
      # the build when a new Hugo needed Dart Sass for the theme's SCSS
      # ("no Dart Sass binary found in $PATH").
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve Hugo modules
        working-directory: docs
        run: hugo mod tidy

      - name: Build
        working-directory: docs
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
