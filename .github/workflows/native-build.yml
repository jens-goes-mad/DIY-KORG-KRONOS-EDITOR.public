name: Build Kronos Editor (native)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip the 4-platform native rebuild for changes that can't affect it
    # (docs/, frontend/ -- Debug reads frontend/ from disk, Release embeds
    # it as inert byte data, neither path recompiles anything when it
    # changes). Tags always build regardless of paths, since path filters
    # only apply to branch pushes.
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/native-build.yml"

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-macos-arm64
          path: build/kronos_editor

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-macos-x86_64
          path: build/kronos_editor

  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-linux-x86_64
          path: build/kronos_editor

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-windows-x86_64
          path: build/Release/kronos_editor.exe

  # Only for a version tag push (`git tag v1.2.3 && git push --tags`) -- a
  # plain push to main still builds+verifies all 4 platforms above (path
  # filters permitting) but never publishes anything. Attaches each
  # platform's binary to a real GitHub Release for that tag rather than
  # leaving them as workflow-run artifacts, which need a GitHub login and
  # expire after 90 days -- release assets are public, permanent, and get a
  # stable README-linkable URL via GitHub's own "latest release" redirect
  # (releases/latest/download/<filename>), which always resolves to
  # whatever the newest tag's matching asset is without ever needing to
  # edit the link again. Needs `contents: write` explicitly since the
  # default GITHUB_TOKEN is read-only on this repo; scoped to just this
  # job, the 4 build jobs above stay untouched.
  release:
    runs-on: ubuntu-latest
    needs: [macos-arm64, macos-x86_64, linux-x86_64, windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each platform's binary keeps its build-time filename (kronos_editor/
      # kronos_editor.exe) inside its own uniquely-named artifact folder.
      # macOS/Linux ship as .zip, not the raw binary directly: a plain HTTP
      # download (which is all a GitHub Release asset ever is) carries no
      # Unix permission bits at all, so a `chmod +x` here only affects this
      # CI runner's own copy -- the file a browser saves to a user's disk
      # always lands non-executable regardless. Confirmed directly: v0.1.0's
      # raw macos-x86_64 binary, once downloaded, couldn't be launched by
      # Finder at all -- it fell back to opening the binary's raw bytes in a
      # text editor. The zip format DOES store Unix permissions internally,
      # and macOS's own Archive Utility restores them correctly on extract,
      # so the exec bit set here survives all the way to the user's disk.
      # Windows doesn't have this problem (a .exe runs by extension, no
      # Unix-permission concept involved), so it stays a raw file.
      - name: Assemble release assets
        run: |
          mkdir -p release
          chmod +x artifacts/kronos-editor-macos-arm64/kronos_editor
          chmod +x artifacts/kronos-editor-macos-x86_64/kronos_editor
          chmod +x artifacts/kronos-editor-linux-x86_64/kronos_editor
          (cd artifacts/kronos-editor-macos-arm64 && zip -j "$GITHUB_WORKSPACE/release/kronos_editor-macos-arm64.zip" kronos_editor)
          (cd artifacts/kronos-editor-macos-x86_64 && zip -j "$GITHUB_WORKSPACE/release/kronos_editor-macos-x86_64.zip" kronos_editor)
          (cd artifacts/kronos-editor-linux-x86_64 && zip -j "$GITHUB_WORKSPACE/release/kronos_editor-linux-x86_64.zip" kronos_editor)
          cp artifacts/kronos-editor-windows-x86_64/kronos_editor.exe release/kronos_editor-windows-x86_64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
