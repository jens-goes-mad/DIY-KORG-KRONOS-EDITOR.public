name: Build Kronos Editor (native)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip the 4-platform native rebuild for changes that can't affect it
    # (docs/, frontend/ -- Debug reads frontend/ from disk, Release embeds
    # it as inert byte data, neither path recompiles anything when it
    # changes). Tags always build regardless of paths, since path filters
    # only apply to branch pushes.
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "third_party/**"
      - "tools/**"
      - ".github/workflows/native-build.yml"

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # A real .app bundle now (CMakeLists.txt's APPLE block, Release-only) --
      # a bare Unix executable has no way to tell Finder it's a windowed GUI
      # app, so double-clicking one launches it INSIDE Terminal.app instead.
      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-macos-arm64
          path: build/kronos_editor.app

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-macos-x86_64
          path: build/kronos_editor.app

  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-linux-x86_64
          path: build/kronos_editor

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: kronos-editor-windows-x86_64
          path: build/Release/kronos_editor.exe

  # Only for a version tag push (`git tag v1.2.3 && git push --tags`) -- a
  # plain push to main still builds+verifies all 4 platforms above (path
  # filters permitting) but never publishes anything. Attaches each
  # platform's binary to a real GitHub Release for that tag rather than
  # leaving them as workflow-run artifacts, which need a GitHub login and
  # expire after 90 days -- release assets are public, permanent, and get a
  # stable README-linkable URL via GitHub's own "latest release" redirect
  # (releases/latest/download/<filename>), which always resolves to
  # whatever the newest tag's matching asset is without ever needing to
  # edit the link again. Needs `contents: write` explicitly since the
  # default GITHUB_TOKEN is read-only on this repo; scoped to just this
  # job, the 4 build jobs above stay untouched.
  release:
    runs-on: ubuntu-latest
    needs: [macos-arm64, macos-x86_64, linux-x86_64, windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # macOS ships as a real .app bundle now (CMakeLists.txt's APPLE
      # block) -- a bare Unix executable has no way to tell Finder it's a
      # windowed GUI app, so double-clicking one used to launch it INSIDE
      # Terminal.app instead (confirmed directly against the actual v0.1.1
      # release). Every platform still ships as .zip, not the raw
      # binary/bundle directly, for the SEPARATE reason entry 1 below
      # already covers -- a plain HTTP download carries no Unix permission
      # bits at all, so a `chmod +x` here only affects this CI runner's own
      # copy; the file/bundle a browser saves to a user's disk always lands
      # non-executable regardless (confirmed directly: v0.1.0's raw
      # macos-x86_64 binary, once downloaded, couldn't be launched at
      # all -- it fell back to opening the binary's raw bytes in a text
      # editor). The zip format DOES store Unix permissions internally, and
      # macOS's own Archive Utility restores them correctly on extract
      # (`zip -r`, not `-j`, for the .app bundles specifically -- their
      # internal Contents/MacOS/... structure has to survive, not just the
      # one executable inside it). Windows doesn't have this problem (a
      # .exe runs by extension, no Unix-permission concept involved), so it
      # stays a raw file.
      - name: Assemble release assets
        run: |
          mkdir -p release

          # actions/upload-artifact@v4, given a single directory path (the
          # macos-*/upload step: path: build/kronos_editor.app), uploads
          # that directory's CONTENTS, not the directory itself -- verified
          # directly against a real failed run (v0.1.2's release job:
          # "chmod: cannot access '.../kronos_editor.app/Contents/MacOS/
          # kronos_editor': No such file or directory"), not assumed from
          # docs. So each macOS artifact lands here as a bare `Contents/`
          # folder, missing the `kronos_editor.app` wrapper a real bundle
          # needs -- reconstructed by hand before zipping.
          for plat in macos-arm64 macos-x86_64; do
            mkdir -p "artifacts/kronos-editor-$plat/kronos_editor.app"
            mv "artifacts/kronos-editor-$plat/Contents" "artifacts/kronos-editor-$plat/kronos_editor.app/Contents"
          done

          chmod +x artifacts/kronos-editor-macos-arm64/kronos_editor.app/Contents/MacOS/kronos_editor
          chmod +x artifacts/kronos-editor-macos-x86_64/kronos_editor.app/Contents/MacOS/kronos_editor
          chmod +x artifacts/kronos-editor-linux-x86_64/kronos_editor
          (cd artifacts/kronos-editor-macos-arm64 && zip -r "$GITHUB_WORKSPACE/release/kronos_editor-macos-arm64.zip" kronos_editor.app)
          (cd artifacts/kronos-editor-macos-x86_64 && zip -r "$GITHUB_WORKSPACE/release/kronos_editor-macos-x86_64.zip" kronos_editor.app)
          (cd artifacts/kronos-editor-linux-x86_64 && zip -j "$GITHUB_WORKSPACE/release/kronos_editor-linux-x86_64.zip" kronos_editor)
          cp artifacts/kronos-editor-windows-x86_64/kronos_editor.exe release/kronos_editor-windows-x86_64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
