version: '3.8'
services:
  hugo:
    image: hugomods/hugo:exts-non-root
    volumes:
      - .:/src
      - ${HOME}/hugo_cache:/tmp/hugo_cache
    ports:
      - "1313:1313"
    # command: server --bind 0.0.0.0
    # command: server --bind 0.0.0.0 --noBuildLock --disableFastRender --cleanDestinationDir
    # --baseURL overrides config.toml's production baseurl (jens-goes-mad.github.io)
    # for THIS dev server only -- config.toml's own `canonifyURLs = true` makes Hugo
    # write fully-absolute URLs into every generated page (needed so root-relative
    # content links resolve correctly under GitHub Pages' /DIY-KORG-KRONOS-EDITOR/
    # subpath), which without this override means every asset/image src points at
    # the real production domain even when served locally -- anything not yet
    # pushed just 404s in the browser, even though the dev server has it. The
    # production build (`hugo --minify`, run by .github/workflows/hugo.yml) never
    # passes --baseURL, so it's unaffected and still uses config.toml's real value.
    command: hugo server --bind 0.0.0.0 --baseURL http://localhost:1313/DIY-KORG-KRONOS-EDITOR/ --disableFastRender --noBuildLock --cleanDestinationDir -D
