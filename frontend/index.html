<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>DIY Kronos Editor</title>
  <!-- Vendored, not CDN-linked -- see frontend/vendor/BULMA_VERSION.txt.
       This app has no general internet access assumption (fetchResource
       serves everything from local disk, same as third_party/choc/), so a
       CDN <link> would just fail. Loaded before style.css so our own rules
       can override Bulma's where needed. data-theme="dark" above forces
       Bulma's dark palette unconditionally (this app is always-dark, not
       theme-togglable, so relying on the OS's prefers-color-scheme instead
       would drift from our own hard-coded dark :root in style.css whenever
       the OS itself isn't in dark mode).

       `is-mobile` on .level below: Bulma is mobile-first -- .level only
       becomes a row layout (instead of stacking) past a 769px media-query
       breakpoint. The topbar should never stack (there's nothing to
       usefully stack it into), so `is-mobile` forces row layout there
       unconditionally, no breakpoint involved.

       .panes below is deliberately WITHOUT is-mobile, unlike the topbar --
       per explicit request, the two-pane split should actually stack full-
       width below the 769px breakpoint and go side-by-side (half each)
       above it, mirroring Bootstrap's classic 12/6 responsive-column
       pattern. This app's own window has an 800px floor (main.cpp), which
       already clears 769px, so the native app always shows side-by-side --
       the stacking only becomes visible when testing in a plain browser
       tab narrower than that (mock_bridge.js's no-build testing mode). -->
  <link rel="stylesheet" href="vendor/bulma.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar level is-mobile">
    <div class="level-left">
      <button class="button is-small mr-3 open-file-button" type="button" title="Open a .PCG/.SNG file via a native file picker -- lands in whichever pane is empty, or just becomes selectable from either pane's dropdown if both are occupied">Open...</button>
      <h1 class="title is-5 mb-0" title="Click &quot;Open...&quot; above to load a .PCG/.SNG file as a new dataset, or pick an already-open one from a pane's selector -- both panes on the same dataset share edits. Each pane's Setlist/Programs/Combis/Duplicates tabs browse whichever dataset it's showing. Setlist rows: drop directly on another row to copy it over, or between two rows to insert (shifting the rest down); drag across panes/datasets to copy a Program row.">DIY Kronos Editor</h1>
    </div>
    <div class="level-right">
      <!-- Which pane(s) are visible -- "Both" (default) shows the normal
           side-by-side split; "Left"/"Right" hides the other one and
           expands the remaining pane to full width, useful on a narrow/
           small screen where seeing two half-width panes at once is
           cramped. Reflects whichever pane is currently on that VISUAL
           side, not a fixed paneId -- see app.js's swapPanes()/
           setPaneVisibility(): swapping panes and toggling this are
           independent, so this always means "the pane currently shown on
           the left/right," even after a swap. -->
      <div class="pane-visibility-bar">
        <div class="buttons has-addons">
          <button class="button is-small pane-visibility-button" data-visibility="left" type="button" title="Show only the left pane">Left only</button>
          <button class="button is-small is-link pane-visibility-button" data-visibility="both" type="button" title="Show both panes">Both</button>
          <button class="button is-small pane-visibility-button" data-visibility="right" type="button" title="Show only the right pane">Right only</button>
        </div>
      </div>
      <div class="topbar-loading" hidden>
        <div class="topbar-loading-spinner"></div>
        <span class="topbar-loading-text">Loading...</span>
      </div>
      <!-- Only ever shown when the optional private companion module is
           actually linked into this build (app.js checks
           `typeof window.hasPrivateModule === "function"` -- see
           Sgx2Editor.cpp's own doc comment on that binding in the private
           repo) -- hidden here by default so a public build, which never
           gets that binding at all, never shows a button that would do
           nothing if clicked. Opens the private module's own MIDI Settings
           window (device list + dump request, 2026-08-28). -->
      <button class="button is-small settings-button" type="button" hidden
              title="MIDI Settings (experimental -- private build only)">⚙</button>
    </div>
  </header>

  <main class="view" id="setlistsView">
    <div class="panes columns">
      <section class="pane column is-12-mobile is-6-tablet" data-pane="A"></section>
      <button class="swap-panes-button" type="button" title="Swap panes A and B">⇄</button>
      <section class="pane column is-12-mobile is-6-tablet" data-pane="B"></section>
    </div>
  </main>

  <footer class="statusbar" id="statusBar">Ready.</footer>

  <!-- Transient auto-dismissing popups (app.js's showToast()) -- one shared
       container so toasts from either pane stack in the same place, fixed-
       positioned (style.css) so it floats above everything regardless of
       which category/pane triggered it. aria-live so a screen reader
       announces a toast as it appears, same as it would the status bar. -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Cross-dataset Combi copy's Program-placement panel (combi-cross-
       dataset-panel.js) -- spans both panes (the Combi being copied lives in
       one pane's dataset, the destination in the other), so it's mounted
       here rather than owned by either pane's own DOM, same reasoning as
       toastContainer above. Slides in from whichever screen edge is nearest
       the destination pane -- see that file's own slideDirectionFor(). -->
  <div id="combiCrossDatasetPanelRoot"></div>

  <!-- Generic Yes/No confirmation dialog (confirm-dialog.js), replacing
       window.confirm() -- see that file's own doc comment for why: WKWebView
       drops native JS confirm() dialogs entirely under CHOC's WebView here.
       Mounted at the app level, same reasoning as the two roots above. -->
  <div id="confirmDialogRoot"></div>

  <!-- MIDI Settings (midi-settings-panel.js, 2026-08-28) -- private-module
       only (see app.js's own Settings button, hidden unless
       window.hasPrivateModule exists), mounted at the app level rather than
       owned by either pane since it isn't tied to any pane/dataset at all
       (unlike the Duplicates panel's own resolve-picker sidebar, which IS
       per-pane -- see pane-program-editor.js). Originally a whole separate
       native window (mirroring the private module's own SGX-2 editor
       window); reconsidered per direct feedback -- a single-instance
       utility like this fits the same generic sliding-sidebar shell
       (createSidebarPanel(), sidebar-panel.js) the Duplicates panel's own
       resolve-picker also uses, with far less machinery than a second
       native window needed. -->
  <div id="midiSettingsPanelRoot"></div>

  <!-- Loaded first among the app's own scripts, before anything that might
       call createSidebarPanel() -- see that file's own doc comment for why
       (some callers, e.g. midi-settings-panel.js, invoke it at their own
       top-level eval time, not lazily inside a function, so it must
       already exist by then). -->
  <script src="sidebar-panel.js"></script>
  <script src="datasets.js"></script>
  <script src="pane-setlist-editor.js"></script>
  <script src="pane-program-editor.js"></script>
  <script src="pane-combi-editor.js"></script>
  <script src="pane.js"></script>
  <script src="internals.js"></script>
  <script src="combi-cross-dataset-panel.js"></script>
  <script src="confirm-dialog.js"></script>
  <script src="midi-settings-panel.js"></script>
  <script src="mock_bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
